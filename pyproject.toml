[project]
name = "exec-operating-system"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.2",
]

[project.scripts]
exec-os = "exec_operating_system.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/exec_operating_system"]
